plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.chafonh103'
version = '0.1.0'

android {
  namespace "expo.modules.chafonh103"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // SDK propietario de Chafon (cf-sdk-v1.0.3.aar) provisto en modules/chafon-h103/android/libs.
  implementation fileTree(dir: 'libs', include: ['*.aar', '*.jar'])
}
